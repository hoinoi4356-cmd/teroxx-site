<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeroxX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="bg.mp4" type="video/mp4">
  </video>
  <div class="bg-veil"></div>
  <div class="bg-aurora"></div>

  <div class="snow" id="snow"></div>

  <div class="enter" id="enter">
    <div class="enter-inner">
      <div class="enter-avatar">T</div>
      <div class="enter-name">TeroxX</div>
      <div class="enter-tag">click to enter...</div>
      <div class="enter-bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="music-box">
    <button class="mute-btn" id="muteBtn" title="music">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-8v2.1a7 7 0 0 1 0 11.8V20a9 9 0 0 0 0-16Z"/></svg>
    </button>
    <input type="range" class="vol" id="vol" min="0" max="100" value="50" title="volume">
  </div>

  <main class="page">
    <div class="avatar-wrap">
      <div class="orbit orbit-1"></div>
      <div class="orbit orbit-2"></div>
      <div class="avatar" id="avatar"><img src="avatar.png" alt="avatar"></div>
    </div>

    <div class="head">
      <h1 class="username">
        TeroxX
        <span class="tag">TeroxX</span>
      </h1>
      <p class="lastseen"><span class="live"></span> last seen <b>now</b></p>
    </div>

    <div class="socials" id="socials">
      <a href="#" class="soc" id="link-discord" target="_blank" rel="noopener" title="Discord">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.2a12 12 0 0 1 3.5 1.7 14 14 0 0 0-12 0A12 12 0 0 1 9.9 4.1L9.3 3a19.8 19.8 0 0 0-5 1.5A20.3 20.3 0 0 0 .3 17.6a19.6 19.6 0 0 0 5.9 3l1.4-2.3a13 13 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4a13 13 0 0 1-2 1l1.4 2.3a19.6 19.6 0 0 0 6-3A20.3 20.3 0 0 0 20.3 4.4ZM8.4 15.1c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm7.2 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
      </a>

      <a href="#" class="soc" id="link-tiktok" target="_blank" rel="noopener" title="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.3 1.8 1.4 3 3.2 3.3v2.7a6.3 6.3 0 0 1-3.2-.9v5.6a5.6 5.6 0 1 1-5.6-5.6c.3 0 .6 0 .9.1v2.8a2.9 2.9 0 1 0 1.9 2.7V3h2.8Z"/></svg>
      </a>

      <a href="#" class="soc" id="link-twitch" target="_blank" rel="noopener" title="Twitch">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 2 2.5 5.5V20h4.5v2.5h2.5L12 20h3.5L21.5 14V2H4Zm14.5 11-3 3H12l-2.5 2.5V16H5.5V4.5h12v8.5ZM14 7.5h2v4h-2v-4Zm-4.5 0h2v4h-2v-4Z"/></svg>
      </a>

      <a href="#" class="soc" id="link-steam" target="_blank" rel="noopener" title="Steam">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-9.9 11.8l3.6 2.7a2.5 2.5 0 0 1 1.6-.5l2.6-4.4a2.2 2.2 0 1 1-2-3.6 2.2 2.2 0 0 1 2 1.8l2.4 3a2.6 2.6 0 0 1 1-.1 2.36 2.36 0 1 1-2.2 3.1l-2.7 1.5-2.6.1H8a10 10 0 1 0 3-19.6Zm2 4.7a1.7 1.7 0 1 0 2.9 1.2 1.7 1.7 0 0 0-2.9-1.2ZM5.5 15.6a1.9 1.9 0 1 0 2.2 3 1.9 1.9 0 0 0-2.2-3Zm1 .7v2l-1.8-2.2 1.8.2Z"/></svg>
      </a>

      <a href="#" class="soc" id="link-youtube" target="_blank" rel="noopener" title="YouTube">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8ZM9.5 15.5v-7l6.4 3.5-6.4 3.5Z"/></svg>
      </a>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-num" id="views">0</span>
        <span class="stat-label">profile views</span>
      </div>
    </div>

    <footer class="foot">© TeroxX</footer>
  </main>

  <audio id="audio" src="song.mp3" loop></audio>

  <script src="script.js"></script>
</body>
</html>
